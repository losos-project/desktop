name: Rust autofix

# Format the tree the way CI's `format` job checks, apply rustfmt to every
# Rust workspace the repository carries, and rerun CI on the branch. Clippy
# autofix runs only on `proxy/`, the one crate plain `cargo` on the runner
# exercises; everything else is built through Nix and needs a desk for
# `cargo clippy --fix`.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to format and autofix before merging
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: rust-autofix-${{ inputs.branch }}
  cancel-in-progress: false

env:
  NIX_VERSION: "2.34.8"
  NIX_INSTALLER_SHA256: "96c10e102c88809dd9ec0bee89200c4a51eae4c9f6d8698c26b16788d131e078"

jobs:
  autofix:
    name: Format, apply Clippy fixes, and rerun CI
    runs-on: ubuntu-24.04
    steps:
      - name: Validate target branch
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_BRANCH" =~ ^[A-Za-z0-9._/-]+$ || "$TARGET_BRANCH" == -* || "$TARGET_BRANCH" == *..* ]]; then
            echo "::error::Invalid branch name"
            exit 1
          fi
          if [[ "$TARGET_BRANCH" == refs/* || "$TARGET_BRANCH" == */ ]]; then
            echo "::error::Pass a branch name, not a ref path"
            exit 1
          fi

      - name: Install Nix
        run: |
          curl -sSfL --proto '=https' \
            "https://releases.nixos.org/nix/nix-$NIX_VERSION/install" -o install-nix
          echo "$NIX_INSTALLER_SHA256  install-nix" | sha256sum -c -
          sh install-nix --daemon --yes --no-channel-add
          echo "experimental-features = nix-command flakes" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply nixfmt and Rust formatting
        run: |
          set -euo pipefail
          nix fmt
          rustup default stable
          rustup target add wasm32-unknown-unknown
          for manifest in \
            proxy/Cargo.toml \
            plugins/Cargo.toml \
            src/app-windows/Cargo.toml \
            src/danube/Cargo.toml; do
            cargo fmt --manifest-path "$manifest"
          done
          for manifest in src/*/Cargo.toml; do
            case "$manifest" in
              src/app-windows/Cargo.toml|src/danube/Cargo.toml) continue ;;
            esac
            cargo fmt --manifest-path "$manifest"
          done

      - name: Apply Clippy autofixes in proxy
        working-directory: proxy
        run: |
          set -euo pipefail
          cargo clippy --fix --allow-dirty --allow-staged -- -D warnings

      - name: Commit fixes to the selected branch
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No autofixes were needed."
            exit 0
          fi
          git config user.name "losos-ci-bot"
          git config user.email "losos-ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "style: apply formatting and Clippy fixes [skip ci]"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Dispatch CI for the updated branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: gh workflow run ci.yml --ref "$TARGET_BRANCH"
