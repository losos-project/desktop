# Every Monday, the lockfiles move to what their manifests allow now, as one
# pull request that merges itself once its checks pass (docs/trust.md,
# "Keeping the pins current").
#
# `update` runs tools/update-lockfiles: flake.lock, every Cargo.lock and
# package-lock.json outside components/, the submodules to their
# repositories' newest weekly releases, and the fixed-output hashes they
# move. If anything changed it pushes `automation/lockfiles-<date>`, opens a
# pull request for it and closes the previous week's if that one never
# merged. `merge` wakes whenever `ci` or `docs` finishes on such a branch,
# waits for every other check on the same commit, and merges with a merge
# commit only when all of them passed and no VM test warned. Anything less
# leaves the pull request open, with a comment saying why.
#
# Both jobs use LOCKFILE_UPDATE_TOKEN, a fine-grained token with Contents and
# Pull requests write on this repository. Actions' own token cannot do the
# job: GitHub starts no workflow for a pull request it opened or a push it
# made, so neither the pull request's checks nor main's run after the merge
# would happen, and this organization does not let Actions open pull
# requests at all. Without the secret, `update` pushes the branch with that
# token and links the page that opens the pull request by hand.
name: lockfiles

on:
  schedule:
    # Monday 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: [ci, docs]
    types: [completed]

permissions:
  contents: read

jobs:
  update:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Only for the fallback push without LOCKFILE_UPDATE_TOKEN.
    permissions:
      contents: write
    env:
      NIX_VERSION: "2.34.8"
      # The installer script's own hash, from releases.nixos.org's
      # install.sha256 for that version, as in ci.yml.
      NIX_INSTALLER_SHA256: "96c10e102c88809dd9ec0bee89200c4a51eae4c9f6d8698c26b16788d131e078"
    steps:
      # Re-fetching the vendored crates of Sonne, derisk and pm takes a few
      # gigabytes on top of the toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache
          df -h /

      - name: Install Nix
        run: |
          curl -sSfL --proto '=https' \
            "https://releases.nixos.org/nix/nix-$NIX_VERSION/install" -o install-nix
          echo "$NIX_INSTALLER_SHA256  install-nix" | sha256sum -c -
          sh install-nix --daemon --yes --no-channel-add
          echo "experimental-features = nix-command flakes" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      # The submodules are evaluated with the release, and move to their
      # repositories' weekly releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, submodules: true }

      # gh reads the components' releases with it; they are public.
      - name: Update the lockfiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/update-lockfiles > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Propose them
        env:
          TOKEN: ${{ secrets.LOCKFILE_UPDATE_TOKEN || github.token }}
          HAS_TOKEN: ${{ secrets.LOCKFILE_UPDATE_TOKEN != '' }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # HEAD, because a moved submodule is staged, not just changed.
          if git diff HEAD --quiet; then
            echo "Every lockfile is already current." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="automation/lockfiles-$(date -u +%Y%m%dT%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "chore(deps): update lockfiles" -m "$(cat "$RUNNER_TEMP/summary.md")"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            push origin "HEAD:refs/heads/$branch"

          if [ "$HAS_TOKEN" != true ]; then
            echo "::warning::LOCKFILE_UPDATE_TOKEN is not set, so no pull request was opened for $branch."
            echo "Open it by hand: $GITHUB_SERVER_URL/$GH_REPO/compare/$BASE...$branch?expand=1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export GH_TOKEN=$TOKEN
          {
            echo "## Description"
            echo
            echo "The weekly lockfile update from [this run]($RUN_URL). It merges itself, with a merge commit, once every check on it passes and no VM test warns; otherwise it stays open for a person."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "## Screenshots"
            echo
            echo "No visible change."
            echo
            echo "## Reviewer notes"
            echo
            echo "Made by \`tools/update-lockfiles\`. Manifests are unchanged; a submodule moves only to its repository's newest weekly release, or to the mcsapi revision derisk's lock names."
          } > "$RUNNER_TEMP/body.md"
          url=$(gh pr create --base "$BASE" --head "$branch" \
            --title "chore(deps): update lockfiles" --body-file "$RUNNER_TEMP/body.md")
          echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
          # A week's update that never merged is replaced, not stacked on.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"automation/lockfiles-\")) | select(.headRefName != \"$branch\") | .number" |
            while read -r old; do
              gh pr close "$old" --delete-branch --comment "Superseded by $url." ||
                echo "::warning::Could not close #$old."
            done

  merge:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'automation/lockfiles-') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # `ci` and `docs` each wake this; one at a time, so only one merges.
    concurrency:
      group: lockfiles-merge-${{ github.event.workflow_run.head_branch }}
    env:
      GH_TOKEN: ${{ secrets.LOCKFILE_UPDATE_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      # ci.yml reports a VM test that did not pass as a warning with this
      # title, not as a failed job, so a green run can still carry one.
      BLOCKING_ANNOTATION: "VM test "
    steps:
      - name: Merge once every check passed
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::LOCKFILE_UPDATE_TOKEN is not set, so $BRANCH is left for a person to merge."
            exit 0
          fi
          pr=$(gh pr list --head "$BRANCH" --state open --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$SHA\") | .number")
          if [ -z "$pr" ]; then
            echo "No open pull request has $SHA at its head."
            exit 0
          fi

          # Every check on the commit, from any workflow or app, has to
          # finish first; this run's own jobs are on main's commit, not here.
          # A check that outlasts the wait is left to the next run this wakes,
          # which `ci`, the longest, always gives.
          checks() {
            gh api --paginate "repos/$GH_REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | [.id, .status, (.conclusion // ""), .name] | @tsv'
          }
          for _ in $(seq 15); do
            checks > checks.tsv
            awk -F'\t' '$2 != "completed"' checks.tsv | grep -q . || break
            sleep 60
          done
          if awk -F'\t' '$2 != "completed"' checks.tsv | grep -q .; then
            echo "Checks are still running; the next one to finish decides."
            exit 0
          fi

          reason=$(awk -F'\t' '$3 !~ /^(success|skipped|neutral)$/ { print "- " $4 ": " $3 }' checks.tsv)
          if [ -z "$reason" ]; then
            reason=$(cut -f1 checks.tsv | while read -r id; do
              gh api "repos/$GH_REPO/check-runs/$id/annotations" \
                --jq ".[] | select(.title // \"\" | startswith(\"$BLOCKING_ANNOTATION\")) | \"- \" + .title + \": \" + .message"
            done)
          fi
          if [ -n "$reason" ]; then
            marker="<!-- lockfiles: $SHA -->"
            if ! gh pr view "$pr" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
              printf '%s\nNot merging %s, because:\n\n%s\n' "$marker" "$SHA" "$reason" |
                gh pr comment "$pr" --body-file -
            fi
            echo "Not merging: $reason"
            exit 0
          fi

          # Main moved since the branch was cut: bring it in, and the checks
          # that run on the new head decide again.
          if [ "$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus)" = BEHIND ]; then
            gh pr update-branch "$pr"
            exit 0
          fi
          gh pr merge "$pr" --merge --match-head-commit "$SHA" --delete-branch
