# Every Monday, the lockfiles move to what their manifests allow now, in one
# commit straight to the default branch (docs/trust.md,
# "Keeping the pins current").
#
# `update` runs tools/update-lockfiles: flake.lock, every Cargo.lock and
# package-lock.json outside components/, the submodules to their
# repositories' newest weekly releases, and the fixed-output hashes they
# move.
#
# If anything changed, `update` commits the result straight to the default
# branch, with no pull request: CI's run on that commit is the check, and a
# lockfile that breaks the build shows there as any other push would. If the
# branch moved while this ran, the commit is rebased onto it first; a
# conflict leaves this week's update unpushed and the run red, and running
# it again starts afresh.
#
# The push uses LOCKFILE_UPDATE_TOKEN, a fine-grained token with Contents
# write on this repository, when there is one: GitHub starts no workflow for
# a push made with Actions' own token, so CI would not run on the update
# until the next push. Without the secret it pushes with that token all the
# same. A branch rule that refuses direct pushes to the default branch has
# to let the token's owner, or Actions, bypass it.
name: lockfiles

on:
  schedule:
    # Monday 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Only for the push without LOCKFILE_UPDATE_TOKEN.
    permissions:
      contents: write
    env:
      NIX_VERSION: "2.34.8"
      # The installer script's own hash, from releases.nixos.org's
      # install.sha256 for that version, as in ci.yml.
      NIX_INSTALLER_SHA256: "96c10e102c88809dd9ec0bee89200c4a51eae4c9f6d8698c26b16788d131e078"
    steps:
      # Re-fetching the vendored crates of Sonne, derisk and pm takes a few
      # gigabytes on top of the toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache
          df -h /

      - name: Install Nix
        run: |
          curl -sSfL --proto '=https' \
            "https://releases.nixos.org/nix/nix-$NIX_VERSION/install" -o install-nix
          echo "$NIX_INSTALLER_SHA256  install-nix" | sha256sum -c -
          sh install-nix --daemon --yes --no-channel-add
          echo "experimental-features = nix-command flakes" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      # The submodules are evaluated with the release, and move to their
      # repositories' weekly releases. The checkout is the default branch,
      # whatever branch a run by hand was started on: the commit is rebased
      # onto it and pushed there, so a feature branch's own commits must not
      # be in it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      # gh reads the components' releases with it; they are public.
      - name: Update the lockfiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/update-lockfiles > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Push them to the default branch
        env:
          TOKEN: ${{ secrets.LOCKFILE_UPDATE_TOKEN || github.token }}
          HAS_TOKEN: ${{ secrets.LOCKFILE_UPDATE_TOKEN != '' }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          # HEAD, because a moved submodule is staged, not just changed.
          if git diff HEAD --quiet; then
            echo "Every lockfile is already current." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # No line naming the run: commits here carry no attribution, and the
          # run's own summary already lists what moved.
          git commit -qam "chore(deps): update lockfiles" -m "$(cat "$RUNNER_TEMP/summary.md")"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" fetch --quiet origin "$BASE"
          if ! git rebase --quiet "origin/$BASE"; then
            git rebase --abort
            echo "::error::$BASE changed the same lockfiles while this ran, so the update is not pushed; run the workflow again."
            exit 1
          fi
          git -c http.extraheader="$auth" push origin "HEAD:refs/heads/$BASE"
          echo "Pushed $(git rev-parse --short HEAD) to $BASE." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_TOKEN" != true ]; then
            echo "::warning::LOCKFILE_UPDATE_TOKEN is not set, so the update was pushed with Actions' own token and CI does not run on it until the next push."
          fi
