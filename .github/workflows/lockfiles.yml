# Every Monday, the lockfiles move to what their manifests allow now, and
# land as one pull request that merges itself when CI passes
# (docs/trust.md, "Keeping the pins current").
#
# `update` runs tools/update-lockfiles: flake.lock, every Cargo.lock and
# package-lock.json, tools/update-packages for the custom packages' upstream
# pins, the component inputs (derisk, mcsapi and pm) to their repositories'
# newest weekly releases, and the fixed-output hashes they move.
#
# If anything changed, `update` pushes the result to a `lockfiles/update`
# branch and opens or refreshes a pull request titled
# "chore(deps): update lockfiles", then asks GitHub to merge it once its
# checks pass: main's rules refuse a direct push, and merging is what
# they wait for (CodeQL's analysis, the required checks, coverage).
#
# The push uses LOCKFILE_UPDATE_TOKEN, a fine-grained token with Contents
# and Pull requests write on this repository, and it is required: a
# branch pushed with Actions' own token starts no workflow, so the pull
# request's required checks would never run and it could never merge.
# GitHub starts no workflow for Actions' token's pushes either, so a
# merged update runs CI because the token, not Actions, made the merge.
name: lockfiles

on:
  schedule:
    # Monday 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Everything that lands does so through LOCKFILE_UPDATE_TOKEN; Actions'
    # own token only reads.
    permissions:
      contents: read
    env:
      NIX_VERSION: "2.34.8"
      # The installer script's own hash, from releases.nixos.org's
      # install.sha256 for that version, as in ci.yml.
      NIX_INSTALLER_SHA256: "96c10e102c88809dd9ec0bee89200c4a51eae4c9f6d8698c26b16788d131e078"
    steps:
      # Re-fetching the vendored crates of Sonne, derisk and pm takes a few
      # gigabytes on top of the toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache
          df -h /

      - name: Install Nix
        run: |
          curl -sSfL --proto '=https' \
            "https://releases.nixos.org/nix/nix-$NIX_VERSION/install" -o install-nix
          echo "$NIX_INSTALLER_SHA256  install-nix" | sha256sum -c -
          sh install-nix --daemon --yes --no-channel-add
          echo "experimental-features = nix-command flakes" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      # The component inputs are evaluated with the release, and move to
      # their repositories' weekly releases. The checkout is the default
      # branch, whatever branch a run by hand was started on: the pull
      # request is raised against it, so a feature branch's own commits must
      # not be in it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      # gh reads the components' releases with it; they are public.
      - name: Update the lockfiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/update-lockfiles > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Raise the pull request
        env:
          TOKEN: ${{ secrets.LOCKFILE_UPDATE_TOKEN }}
          HAS_TOKEN: ${{ secrets.LOCKFILE_UPDATE_TOKEN != '' }}
          BASE: ${{ github.event.repository.default_branch }}
          BRANCH: lockfiles/update
          TITLE: "chore(deps): update lockfiles"
          GH_TOKEN: ${{ secrets.LOCKFILE_UPDATE_TOKEN }}
        run: |
          # HEAD, so unstaged changes count the same as staged ones: a lock
          # move is an ordinary file change now.
          if git diff HEAD --quiet; then
            echo "Every lockfile is already current." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Actions' token cannot make this pull request workable: a branch
          # or merge pushed with it starts no workflow, so the required
          # checks would never run and the rules would refuse the merge.
          if [ "$HAS_TOKEN" != true ]; then
            echo "::error::LOCKFILE_UPDATE_TOKEN is not set. Main's rules refuse direct pushes and merging is what they wait for, so the update needs a token with Contents and Pull requests write; without it nothing is pushed."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # No line naming the run: commits here carry no attribution, and
          # the pull request body already lists what moved.
          git commit -qam "$TITLE" -m "$(cat "$RUNNER_TEMP/summary.md")"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" push --force origin "HEAD:refs/heads/$BRANCH"
          # A branch already up from an earlier week updates its pull
          # request; a first push opens one.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base "$BASE" --title "$TITLE" \
              --body "$(cat "$RUNNER_TEMP/summary.md")"
          else
            gh pr edit "$BRANCH" --body "Rebased onto this week's update.

          $(cat "$RUNNER_TEMP/summary.md")"
          fi
          # Merges when the checks pass, deletes the branch after. If the
          # repository has auto-merge off, this fails and says so.
          gh pr merge "$BRANCH" --auto --squash --delete-branch
          echo "Pull request for $BRANCH raised and set to merge when its checks pass." | tee -a "$GITHUB_STEP_SUMMARY"
