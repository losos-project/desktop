[package]
name = "losos-proxy"
version = "0.1.0"
edition = "2024"
publish = false

# A workspace of its own, like plugins/: it compiles to wasm32-unknown-unknown,
# nothing else in the repository depends on it, and it has no dependencies.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

# The edge runtime compiles the module on a cold start, so size is latency.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
