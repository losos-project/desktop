#!/usr/bin/env -S quickemu --vm
# LosOS Desktop in quickemu, on an x86_64 host: the installer ISO on the
# first start, the installed disk on every start after it. docs/quickemu.md
# says how to fetch the ISO and what each choice below is for.
guest_os="linux"

# Relative to this file. quickemu creates the directory and the disk; the ISO
# is put there by hand, and quickemu stops attaching it once the disk has
# been written to.
disk_img="losos-desktop-x86_64/disk.qcow2"
iso="losos-desktop-x86_64/installer.iso"

# UEFI, because only a UEFI boot goes through systemd-stub, which measures the
# UKI into the TPM. Secure Boot off, because the UKIs are unsigned and GRUB
# chainloads them (docs/boot-loaders.md).
boot="efi"
secureboot="off"

# A TPM, as on the PCs LosOS is for: measured boot, the security report's
# TPM rows, and on a laptop the key that seals the hibernation image
# (docs/hibernation.md). The VM is not a laptop, so it suspends and never
# hibernates unless told it is one. The firmware has to support it too,
# which NixOS's quickemu does not by default (docs/quickemu.md).
tpm="on"

# The disk the first boot lays out (nixos/modules/disk.nix): a 512M ESP, two
# /usr slots of 16G with 256M verity each, root from 8G, /home from 4G and
# swap the size of RAM, about 45G plus RAM in all. 64G is what the Windows
# installer offers by default, and leaves /home most of the rest. The image
# is sparse, so it costs only what is written, about 4.5G after an install.
disk_size="64G"

# Twice the 4G `nix run .#vm` gives, so a few Danube tabs, a Flatpak and an
# update in the background fit without leaning on swap. Swap is the size of
# this, so more RAM also wants more disk.
ram="8G"
cpu_cores="4"

# virtio-vga-gl: the compositor and WPE WebKit draw through virgl instead of
# llvmpipe. Needs a display with GL on the host (quickemu's default, GTK, or
# --display sdl or spice-app); --display none turns it off.
gl="on"
