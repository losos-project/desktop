# GRUB's menu, on every PC: UEFI and legacy BIOS (grub.nix, bios.nix). It
# is built into GRUB's image, the EFI program on the ESP or the core image
# in the BIOS boot partition, with the theme beside it, so nothing on a
# filesystem but grubenv is GRUB's to keep.
#
# It finds the UKIs sysupdate writes, offers the newest, and counts a new
# one's tries in the file names' manner, as systemd-boot did before it.
# Nothing generates it, because nothing about a machine is in it: the UKIs
# are found each time the menu is drawn, on any partition of the disk GRUB
# was started from, so an update needs no step that rewrites it.
#
# UEFI GRUB chainloads the UKI, so systemd-stub runs as it always has: it
# measures the UKI into the TPM, shows its splash and starts the kernel with
# the command line built in. BIOS GRUB cannot start a UKI, which is an EFI
# program. So beside each <id>_<version>.efi, sysupdate puts the same
# version's kernel (.linux), initrd (.initrd) and command line (.grub, a
# few lines of GRUB script that set losos_cmdline), cut from that UKI when the
# release was built; on aarch64, which has no BIOS, only the .grub. The
# UKI's name is still the one that counts: its version and tries are read
# from it.
#
# The early config built into the image sets losos_disk to the disk GRUB
# was started from ("hd0") before it starts this menu, and grub-image.nix
# puts the theme and the serial console in front of it. grub.nix
# substitutes @id@, the image id (system.image.id).

set timeout=3
set timeout_style=menu

# grubenv on the ESP, the same disk's, wherever repart put it.
set losos_env=""
for e in ($losos_disk,*)/EFI/losos/grubenv; do
  if [ -f "$e" ]; then set losos_env="$e"; fi
done

# Boot counting, in grubenv, because GRUB cannot rename a file the way
# systemd-boot does:
#
#   losos_entry    the counted UKI (a "+<tries left>" in its name) on trial
#   losos_left     its tries left, taken from its name when the trial starts
#                  and lowered by one on every boot of it
#   losos_booted   the UKI the last boot started, whichever it was
#   losos_oneshot  a version to start next time instead of the newest, once,
#                  as `bootctl set-oneshot` does. The hibernation hook that
#                  set it is gone with hibernation (kernel-hardening.nix);
#                  the variable stays for a grubenv an older version wrote
#
# losos-grub-bless (grub.nix) reads them back once boot-complete.target is
# reached: it renames the booted UKI to its blessed name as
# systemd-bless-boot would, or, when the trial ran out and an older UKI
# booted instead, renames the failed one to "+0-<n>", the name systemd-boot
# leaves on an entry that used up its tries.
set losos_entry=""
set losos_left=""
set losos_booted=""
set losos_oneshot=""
if [ -n "$losos_env" ]; then
  load_env --skip-sig --file "$losos_env" losos_entry losos_left losos_booted losos_oneshot
fi

# GRUB's script has no arithmetic. sysupdate gives a UKI 3 tries (update.nix),
# and this counts down from up to 9.
function losos_count_down {
  if [ "$losos_left" = 9 ]; then set losos_left=8
  elif [ "$losos_left" = 8 ]; then set losos_left=7
  elif [ "$losos_left" = 7 ]; then set losos_left=6
  elif [ "$losos_left" = 6 ]; then set losos_left=5
  elif [ "$losos_left" = 5 ]; then set losos_left=4
  elif [ "$losos_left" = 4 ]; then set losos_left=3
  elif [ "$losos_left" = 3 ]; then set losos_left=2
  elif [ "$losos_left" = 2 ]; then set losos_left=1
  else set losos_left=0
  fi
}

# Splits a UKI's path into its directory, file name, version and tries left,
# and says whether it is a UKI of this OS that GRUB can start. The release's
# own UKI name ends "_<arch>.efi", so a LOSOS-RELEASE disk on the same
# machine never matches. On a BIOS, a UKI an older release installed
# without its kernel beside it is passed over.
function losos_parse {
  set dir=""
  set name=""
  set version=""
  set left=""
  if [ ! -f "$1" ]; then return 1; fi
  regexp --set=1:dir --set=2:name '^(.*)/([^/]+)$' "$1"
  if regexp --set=1:version --set=3:left '^@id@_([^/+_]+)(\+([0-9]+)(-[0-9]+)?)?\.efi$' "$name"; then
    if [ "$grub_platform" = efi ]; then
      true
    else
      test -f "$dir/@id@_$version.linux"
    fi
  else
    return 1
  fi
}

# $2 the UKI's directory, $3 its file name, $4 its version, $5 its tries
# left from the name, or nothing for a UKI that is not counted ($1 is the
# entry's title). Whichever entry starts, a one-shot request is spent.
function losos_boot {
  set losos_booted="$3"
  set losos_oneshot=""
  if [ -n "$5" ]; then
    if [ "$losos_entry" != "$3" ]; then
      set losos_entry="$3"
      set losos_left="$5"
    fi
    losos_count_down
  fi
  if [ -n "$losos_env" ]; then
    save_env --file "$losos_env" losos_entry losos_left losos_booted losos_oneshot
  fi
  # losos_extra is a few more kernel arguments, for the recovery shell
  # (docs/troubleshooting.md): typed at GRUB's prompt and exported, and
  # nothing else sets it. A chainloaded UKI would take arguments only in
  # place of its whole command line, so with any, a UEFI boot also starts
  # the kernel beside the UKI, as a BIOS boot does, with the UKI's own
  # command line in front of them. Only x86_64 has that kernel, so an
  # aarch64 PC starts its UKI without them.
  #
  # With Secure Boot on, GRUB is locked down and the kernel beside the UKI
  # is not signed, and its initrd and command line could not be checked if
  # it were: they are what usrhash= and the rest of the boot are trusted
  # from. So the UKI starts as signed, and the arguments wait until Secure
  # Boot is off (docs/secure-boot.md).
  if [ "$grub_platform" = efi -a -n "$losos_extra" -a "$lockdown" = y ]; then
    echo "Secure Boot is on, so LosOS starts without losos_extra."
    sleep 3
    chainloader "$2/$3"
  elif [ "$grub_platform" = efi -a -z "$losos_extra" ]; then
    chainloader "$2/$3"
  elif [ "$grub_platform" = efi -a ! -f "$2/@id@_$4.linux" ]; then
    chainloader "$2/$3"
  else
    # The ESP the kernel comes from, which the .grub file passes on so the
    # initrd mounts root from the same disk (bios.nix).
    set losos_esp=""
  # nothing else sets it. A chainloaded UKI takes arguments only in place
  # of its whole command line, so with any, a UEFI boot puts the UKI's own
  # command line, from the .grub file beside it (uki-files.nix), in front
  # of them. On x86_64 it starts the kernel beside the UKI with them, as a
  # BIOS boot does; aarch64 has no kernel beside its UKI, so it passes them
  # to the UKI. A UKI an older release installed without a .grub file is
  # started without them.
  set losos_esp=""
  set losos_cmdline=""
  if [ "$grub_platform" != efi -o -n "$losos_extra" ]; then
    # The ESP the UKI comes from, which the .grub file passes on so the
    # initrd mounts root from the same disk (uki-files.nix).
    if regexp --set=1:part '^\(([^)]+)\)' "$2"; then
      probe --set=losos_esp --part-uuid "($part)"
    fi
    if [ -f "$2/@id@_$4.grub" ]; then
      source "$2/@id@_$4.grub"
    fi
  fi
  if [ "$grub_platform" = efi -a -z "$losos_cmdline" ]; then
    chainloader "$2/$3"
  elif [ "$grub_platform" = efi -a ! -f "$2/@id@_$4.linux" ]; then
    chainloader "$2/$3" $losos_cmdline $losos_extra
  else
    linux "$2/@id@_$4.linux" $losos_cmdline $losos_extra
    initrd "$2/@id@_$4.initrd"
  fi
  boot
}

# The newest UKI with tries left, as systemd-boot picks it: one whose name
# says it has none, or whose trial in grubenv used them up, comes only after
# every other. Versions compare as strings, which orders this OS's
# fixed-width YYYYMMDD.HHMMSS versions the way time does. A one-shot
# request names the version to start instead, as long as it is there.
set losos_best=""
set losos_best_version=""
set losos_spent=""
set losos_spent_version=""
set losos_asked=""
for f in ($losos_disk,*)/EFI/Linux/@id@_*.efi; do
  if losos_parse "$f"; then set usable=1; else continue; fi
  if [ -n "$losos_oneshot" -a "$version" = "$losos_oneshot" ]; then
    set losos_asked="$f"
  fi
  if [ "$left" = 0 ]; then
    set usable=0
  elif [ "$name" = "$losos_entry" -a "$losos_left" = 0 ]; then
    set usable=0
  fi
  if [ "$usable" = 1 ]; then
    if [ -z "$losos_best" -o "$version" ">" "$losos_best_version" ]; then
      set losos_best="$f"
      set losos_best_version="$version"
    fi
  else
    if [ -z "$losos_spent" -o "$version" ">" "$losos_spent_version" ]; then
      set losos_spent="$f"
      set losos_spent_version="$version"
    fi
  fi
done
if [ -z "$losos_best" ]; then
  set losos_best="$losos_spent"
fi
if [ -n "$losos_asked" ]; then
  set losos_best="$losos_asked"
fi

# The chosen UKI first, so it is the default, then the rest.
if losos_parse "$losos_best"; then
  menuentry "LosOS $version" "$dir" "$name" "$version" "$left" {
    losos_boot "$@"
  }
fi
for f in ($losos_disk,*)/EFI/Linux/@id@_*.efi; do
  if [ "$f" = "$losos_best" ]; then continue; fi
  if losos_parse "$f"; then true; else continue; fi
  if [ "$left" = 0 ]; then
    set title="LosOS $version (failed to start)"
  elif [ "$name" = "$losos_entry" -a "$losos_left" = 0 ]; then
    set title="LosOS $version (failed to start)"
  else
    set title="LosOS $version"
  fi
  menuentry "$title" "$dir" "$name" "$version" "$left" {
    losos_boot "$@"
  }
done

# What systemd-boot added by itself on UEFI: Windows Boot Manager, when it is
# on the same disk (the Windows installer puts LosOS beside it), and the
# firmware's own settings.
if [ "$grub_platform" = efi ]; then
  for f in ($losos_disk,*)/EFI/Microsoft/Boot/bootmgfw.efi; do
    if [ -f "$f" ]; then
      menuentry "Windows" "$f" {
        chainloader "$2"
        boot
      }
      break
    fi
  done
  if fwsetup --is-supported; then
    menuentry "Firmware settings" {
      fwsetup
    }
  fi
fi
set default=0
