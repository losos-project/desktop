[package]
name = "losos-boxes"
version = "0.1.0"
edition = "2021"

[lib]
name = "losos_boxes"
path = "src/lib.rs"

[[bin]]
name = "losos-boxes"
path = "src/main.rs"

[dependencies]
# Logs go through tracing to stderr, `RUST_LOG` choosing the level, and
# failures are reported by miette, as in every LosOS program.
miette = { version = "7.6.0", features = ["fancy"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# resolved's Varlink interface and a box's /setup/state.json are JSON.
serde_json = "1"
# The two browsers hand what they see to the thread that writes the
# entries, as in losos-adblock.
crossbeam-channel = "0.5"
# The host's end of the LosOS boxes machine's way to its resolved (`relay`),
# as derisk-machines listens for machines' windows.
vsock = "0.5.4"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
