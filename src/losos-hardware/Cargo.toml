[package]
name = "losos-hardware"
version = "0.1.0"
edition = "2021"

[lib]
name = "losos_hardware"
path = "src/lib.rs"

[[bin]]
name = "losos-hardware"
path = "src/main.rs"

[dependencies]
# Logs go through tracing to stderr, `RUST_LOG` choosing the level, and
# failures are reported by miette, as in every LosOS program.
miette = { version = "7.6.0", features = ["fancy"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# nixos-facter's report and the rules are JSON. The report is read as an
# untyped value: facter's schema is hwinfo's, which is wide, versioned by
# facter rather than by this program, and only a few fields of it matter.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
