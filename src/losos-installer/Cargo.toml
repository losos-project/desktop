[package]
name = "losos-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
# Logs go through tracing to stderr, `RUST_LOG` choosing the level, and
# failures are reported by miette, as in every LosOS program.
miette = { version = "7.6.0", features = ["fancy"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde_json = "1"
# Signing in to GitHub and filing a report, shared with the desktop's own
# reporter.
losos-report = { path = "../losos-report" }

# Fat LTO and one codegen unit, as every Rust crate in losos-desktop builds:
# the release binary is the one on the installer ISO, so it trades build time
# for inlining across crates and a smaller binary.
[profile.release]
lto = true
codegen-units = 1
