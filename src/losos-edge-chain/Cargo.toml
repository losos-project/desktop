[package]
name = "losos-edge-chain"
version = "0.1.0"
edition = "2021"

[lib]
name = "losos_edge_chain"
path = "src/lib.rs"

[[bin]]
name = "losos-edge-chain"
path = "src/main.rs"

[dependencies]
# Logs go through tracing to stderr, `RUST_LOG` choosing the level, and
# failures are reported by miette, as in every LosOS program.
miette = { version = "7.6.0", features = ["fancy"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The edge the host chose, as the host writes it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The address a connection was meant for before the gateway's firewall
# redirected it here, which std has no call for.
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
