[package]
name = "losos-peripherals"
version = "0.1.0"
edition = "2021"

[lib]
name = "losos_peripherals"
path = "src/lib.rs"

[[bin]]
name = "losos-peripherals"
path = "src/main.rs"

[dependencies]
# Logs go through tracing to stderr, `RUST_LOG` choosing the level, and
# failures are reported by miette, as in every LosOS program.
miette = { version = "7.6.0", features = ["fancy"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The router's configuration and what the USB machine says of its devices
# are JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Events from the kernel, the USB machine and the relays reach the router's
# one loop through a bounded channel.
crossbeam-channel = "0.5"
# vsock, netlink and usbfs have no wrappers in std.
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
