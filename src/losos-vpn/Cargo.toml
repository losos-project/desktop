[package]
name = "losos-vpn"
version = "0.1.0"
edition = "2021"

[lib]
name = "losos_vpn"
path = "src/lib.rs"

[[bin]]
name = "losos-vpn"
path = "src/main.rs"

[dependencies]
# Logs go through tracing to the journal, `RUST_LOG` choosing the level, and
# failures are reported by miette, as in every LosOS program.
miette = { version = "7.6.0", features = ["fancy"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
