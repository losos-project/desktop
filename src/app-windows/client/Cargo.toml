[package]
name = "app-windows"
version = "0.1.0"
edition = "2021"

[dependencies]
app-windows-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
base64 = "0.22"
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"
