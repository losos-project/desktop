[package]
name = "macos-app-server"
version = "0.1.0"
edition = "2021"

[dependencies]
app-windows-protocol = { path = "../protocol" }
crossbeam-channel = "0.5"
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-application-services = "0.3"
objc2-app-kit = "0.3"
