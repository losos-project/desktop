[package]
name = "losos-backup"
version = "0.1.0"
edition = "2021"

[lib]
name = "losos_backup"
path = "src/lib.rs"

[[bin]]
name = "losos-backup"
path = "src/main.rs"

[dependencies]
# Logs go through tracing to stderr, `RUST_LOG` choosing the level, and
# failures are reported by miette, as in every LosOS program.
miette = { version = "7.6.0", features = ["fancy"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The settings, the index of what was uploaded and the last run's report
# are JSON files, and so are Nextcloud's and Forgejo's answers.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The walk hands changed files to a few upload threads, as in losos-adblock.
crossbeam-channel = "0.5"
# HTTP with no C dependencies. ureq 2 rather than 3, because only 2 takes a
# whole rustls configuration and a resolver of its own: the box's
# certificate is self-signed with CA:TRUE, which webpki refuses as a server
# certificate, so the connection checks it against the pinned one instead
# (box.rs), and its address is the LosOS boxes machine's, not the box's.
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The pinned certificate's fingerprint, spelled as the box's wizard shows it.
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
