[package]
name = "danube"
version = "0.1.0"
edition = "2021"
description = "The LosOS web browser: WPE WebKit drawn inside an mcsapi window"
license = "AGPL-3.0-or-later"

[dependencies]
danube-sandbox.workspace = true
libc.workspace = true
miette.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json = "1"
# Extensions: a Chrome-style id is the SHA-256 of the manifest's key (or
# name), and a zip's entries are deflated. Only the zip crate's deflate,
# through the zlib-rs flate2 backend the lock already has: no zopfli
# encoder, bzip2, zstd or AES an extension never uses.
sha2 = "0.10"
base64 = "0.22"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The window and WebKit talk over bounded channels, and each helper thread
# is a scoped one that ends with them; crossbeam's channels can be waited
# on with a timeout and shared between receivers, which std's cannot.
crossbeam-channel = "0.5"
# The window and its chrome: eframe on winit, drawn with mcsapi's
# components in the desktop's theme, like derisk's own apps.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Only for its platform traits: the window's event loop runs off the main
# thread, which WebKit has.
winit = { version = "0.30", default-features = false, features = ["wayland", "x11"] }
# Security keys for sites that ask for one (webauthn.rs): Mozilla's
# authenticator crate, Firefox's own CTAP1/CTAP2 over USB HID, with its
# RustCrypto backend rather than NSS or OpenSSL. It finds keys through
# libudev. serde_cbor writes the attestation object its types serialise
# to, and psl knows which domains are public suffixes, which no site may
# claim as its relying party.
authenticator = { version = "0.5", default-features = false, features = ["crypto_rust"] }
serde_cbor = "0.11"
psl = "2"
mcsapi-components = { path = "../../../../components/mcsapi/crates/mcsapi-components" }
mcsapi-theme = { path = "../../../../components/mcsapi/crates/mcsapi-theme" }

[build-dependencies]
pkg-config = "0.3"
# Writes ffi.rs's declarations from WPE WebKit's headers at build time.
bindgen = "0.72"
