[package]
name = "losos-adblock"
version = "0.1.0"
edition = "2021"

[dependencies]
# Logs go through tracing to stderr, `RUST_LOG` choosing the level, and
# failures are reported by miette, as in every LosOS program.
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Brave's filter engine, for its translation of EasyList's whole syntax
# (paths, resource types, first or third party, element hiding) into the
# content blocker rules WebKit compiles. The DNS half needs none of it and
# reads the domain rules itself (rules.rs).
adblock = { version = "0.13.3", default-features = false, features = ["content-blocking", "embedded-domain-resolver", "full-regex-handling"] }
serde_json = "1"
# The forwarder's queries go through a bounded queue to a few worker
# threads, in place of a thread per query.
crossbeam-channel = "0.5"
# Lists are fetched over HTTPS by a client with no C dependencies, which
# reads the system's CA bundle (SSL_CERT_FILE on NixOS).
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
libc = "0.2"
# DNS over HTTPS (doh.rs) speaks TLS itself, with the same rustls, ring and
# platform verifier ureq already brings, so no crate is added.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
