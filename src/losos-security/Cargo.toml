[package]
name = "losos-security"
version = "0.1.0"
edition = "2021"

[lib]
name = "losos_security"
path = "src/lib.rs"

[[bin]]
name = "losos-security"
path = "src/main.rs"

[dependencies]
# Logs go through tracing to stderr, `RUST_LOG` choosing the level, and
# failures are reported by miette, as in every LosOS program.
miette = { version = "7.6.0", features = ["fancy"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The system bus, so GNOME's Privacy & Security panel can read the report.
# zbus rather than a hand-rolled client: the panel talks D-Bus, and the one
# thing worse than no security report is one that lies because its serialiser
# was written in a hurry.
# The blocking API, over the tokio runtime zbus starts for itself: the service
# only answers calls, so it needs no runtime of its own.
zbus = { version = "5.5", default-features = false, features = ["tokio", "blocking-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
